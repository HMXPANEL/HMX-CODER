name: HMXHARNESS Visual QA (cloud emulator screenshots)

# Captures real rendered screens with UiAutomation on a cloud Android emulator.
# All compilation happens here; no device or local Android Studio is required.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hmxharness-liquid-glass-ui

permissions:
  contents: read

concurrency:
  group: hmxharness-visual-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted ubuntu runners already ship the Android SDK at
      # /usr/local/lib/android/sdk (ANDROID_HOME). Do NOT run
      # android-actions/setup-android here: it tries the removed `tools`
      # package and fails. The regular CI workflow also builds without it.

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK and shader compiler
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update && sudo apt-get install -y glslc

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM device still unavailable"

      - name: Run screenshot capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners have no /dev/kvm. The action therefore launches
          # with -accel off, which modern emulator builds refuse unless this
          # opt-in is set. TCG software emulation is slow but works.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Show the dark Liquid Glass palette rather than the emulator's light theme.
            adb shell cmd uimode night yes || true
            # Deterministic frames: no window/animator animations during capture.
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            # The onboarding screen only unlocks "Start harness" once storage is granted.
            adb shell appops set com.hmx.harness.debug MANAGE_EXTERNAL_STORAGE allow || true
            adb shell pm grant com.hmx.harness.debug android.permission.POST_NOTIFICATIONS || true
            mkdir -p screenshots

            shot() { adb exec-out screencap -p > "screenshots/$1.png"; }
            # The debug-only host renders the shipped screen composables with the real
            # AppContainer, repositories and ViewModels. It exists only so a screenshot
            # run can pick a screen without fragile coordinate automation.
            showcase() {
              adb shell am force-stop com.hmx.harness.debug
              adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen "$1" >/dev/null || true
              sleep "${2:-14}"
            }

            # 1. Real shipped entry point: the installed APK launches into onboarding.
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.MainActivity >/dev/null || true
            sleep 25
            shot 06-onboarding

            # 2-6. The six required screens, rendered by the app itself.
            showcase home 16
            shot 01-home
            showcase settings 14
            shot 03-settings
            showcase providers 14
            shot 04-providers
            showcase chat 18
            shot 05-ai-chat
            showcase appnav 16
            adb shell input swipe 4 900 820 900 420 || true
            sleep 4
            shot 02-navigation-drawer

            echo "=== LOGCAT ERRORS ==="
            adb logcat -d -v threadtime | grep -iE 'FATAL|AndroidRuntime|Exception|prismal|hmx.harness' | tail -120 || true
            find screenshots -type f -name '*.png' -exec ls -lh {} \;

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## HMXHARNESS Liquid Glass visual QA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Screenshots: artifact \`hmxharness-liquidglass-screenshots\`"
            echo "- APK: artifact \`hmxharness-liquidglass-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
