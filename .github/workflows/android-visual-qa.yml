name: HMXHARNESS Visual QA (cloud emulator screenshots)

# Captures real rendered screens with UiAutomation on a cloud Android emulator.
# All compilation happens here; no device or local Android Studio is required.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hmxharness-liquid-glass-ui

permissions:
  contents: read

concurrency:
  group: hmxharness-visual-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted ubuntu runners already ship the Android SDK at
      # /usr/local/lib/android/sdk (ANDROID_HOME). Do NOT run
      # android-actions/setup-android here: it tries the removed `tools`
      # package and fails. The regular CI workflow also builds without it.

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK and shader compiler
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update && sudo apt-get install -y glslc

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM device still unavailable"

      - name: Run screenshot capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners have no /dev/kvm. The action therefore launches
          # with -accel off, which modern emulator builds refuse unless this
          # opt-in is set. TCG software emulation is slow but works.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd uimode night yes || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell appops set com.hmx.harness.debug MANAGE_EXTERNAL_STORAGE allow || true
            adb shell pm grant com.hmx.harness.debug android.permission.POST_NOTIFICATIONS || true
            mkdir -p screenshots logs
            adb logcat -c || true

            # NOTE: android-emulator-runner executes EACH LINE as a separate /bin/sh -c,
            # so no shell functions or multi-line blocks here — only single commands.
            # Capture via a device-side file + pull: exec-out screencap can close the
            # adb stream on a software GPU. Nothing is allowed to abort the run early,
            # so a dead screen still leaves logcat evidence for the others.

            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.MainActivity >/dev/null || true
            sleep 8
            adb logcat -d -v threadtime > logs/00-onboarding-startup.txt || true
            sleep 17
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/06-onboarding.png || true
            adb logcat -d -v threadtime > logs/06-onboarding.txt || true

            adb shell am force-stop com.hmx.harness.debug || true
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen home >/dev/null || true
            sleep 8
            adb logcat -d -v threadtime > logs/01-home-startup.txt || true
            sleep 8
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/01-home.png || true
            adb logcat -d -v threadtime > logs/01-home.txt || true

            adb shell am force-stop com.hmx.harness.debug || true
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen settings >/dev/null || true
            sleep 14
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/03-settings.png || true
            adb logcat -d -v threadtime > logs/03-settings.txt || true

            adb shell am force-stop com.hmx.harness.debug || true
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen providers >/dev/null || true
            sleep 14
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/04-providers.png || true
            adb logcat -d -v threadtime > logs/04-providers.txt || true

            adb shell am force-stop com.hmx.harness.debug || true
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen chat >/dev/null || true
            sleep 18
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/05-ai-chat.png || true
            adb logcat -d -v threadtime > logs/05-ai-chat.txt || true

            adb shell am force-stop com.hmx.harness.debug || true
            adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen appnav >/dev/null || true
            sleep 16
            adb shell input swipe 4 900 820 900 420 || true
            sleep 4
            adb shell screencap -p /sdcard/hmx-shot.png || true
            adb pull /sdcard/hmx-shot.png screenshots/02-navigation-drawer.png || true
            adb logcat -d -v threadtime > logs/02-drawer.txt || true

            adb devices || true
            find screenshots -type f -name '*.png' -exec ls -lh {} \; || true
            test -n "$(find screenshots -name '*.png' -size +1k -print -quit)"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-logs
          path: logs/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## HMXHARNESS Liquid Glass visual QA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Screenshots: artifact \`hmxharness-liquidglass-screenshots\`"
            echo "- APK: artifact \`hmxharness-liquidglass-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
