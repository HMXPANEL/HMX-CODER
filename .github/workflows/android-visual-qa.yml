name: HMXHARNESS Visual QA (cloud emulator screenshots)

# Captures real rendered screens with UiAutomation on a cloud Android emulator.
# All compilation happens here; no device or local Android Studio is required.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hmxharness-liquid-glass-ui

permissions:
  contents: read

concurrency:
  group: hmxharness-visual-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted ubuntu runners already ship the Android SDK at
      # /usr/local/lib/android/sdk (ANDROID_HOME). Do NOT run
      # android-actions/setup-android here: it tries the removed `tools`
      # package and fails. The regular CI workflow also builds without it.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM device still unavailable"

      - name: Run screenshot capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners have no /dev/kvm. The action therefore launches
          # with -accel off, which modern emulator builds refuse unless this
          # opt-in is set. TCG software emulation is slow but works.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            mkdir -p screenshots
            # Launch the REAL installed app, no test harness / mockups.
            adb shell am start -n com.hmx.harness.debug/com.hmx.harness.MainActivity || true
            sleep 8
            adb exec-out screencap -p > screenshots/01-home.png
            # Open the navigation drawer with a left-edge swipe, then capture it.
            adb shell input swipe 4 700 720 700 400 || true
            sleep 2
            adb exec-out screencap -p > screenshots/02-drawer.png
            # Go back and capture the settled home screen again.
            adb shell input keyevent 4 || true
            sleep 2
            adb exec-out screencap -p > screenshots/03-home-settled.png
            find screenshots -type f -name '*.png' -exec ls -lh {} \;

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## HMXHARNESS Liquid Glass visual QA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Screenshots: artifact \`hmxharness-liquidglass-screenshots\`"
            echo "- APK: artifact \`hmxharness-liquidglass-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
