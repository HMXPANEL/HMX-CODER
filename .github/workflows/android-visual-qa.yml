name: HMXHARNESS Visual QA (cloud emulator screenshots)

# Captures real rendered screens on cloud Android emulators.
# All compilation happens here; no device or local Android Studio is required.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which theme palette to capture'
        required: true
        default: all
        type: choice
        options: [all, dark, light]
      source_run_id:
        description: 'Optional run id to reuse its APK artifact (skips the build)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - feature/hmxharness-liquid-glass-ui

permissions:
  contents: read

concurrency:
  group: hmxharness-visual-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted ubuntu runners already ship the Android SDK at
      # /usr/local/lib/android/sdk (ANDROID_HOME). Do NOT run
      # android-actions/setup-android here: it tries the removed `tools`
      # package and fails. The regular CI workflow also builds without it.

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK and shader compiler
        if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
        run: |
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update && sudo apt-get install -y glslc

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache

      - name: Reuse APK from a previous cloud run
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/outputs/apk/debug /tmp/hmx-apk
          gh run download "${{ inputs.source_run_id }}" -R HMXPANEL/HMXHARNESS -n hmxharness-liquidglass-apk --dir /tmp/hmx-apk
          cp /tmp/hmx-apk/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM device still unavailable"

      # The first cold SwiftShader boot compiles the glass shaders and is
      # unstable; this disposable emulator warms the AVD shader cache before
      # either theme is captured.
      - name: Warm up emulator shader cache
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scope == 'all'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            timeout 60 adb wait-for-device || true
            timeout 900 adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done' || true
            timeout 180 adb install -r app/build/outputs/apk/debug/app-debug.apk || true
            timeout 45 adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen home >/dev/null || true
            sleep 8
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot /tmp/hmx-warmup.png || true
            timeout 20 adb shell am force-stop com.hmx.harness.debug || true

      # Two fresh emulator instances: SwiftShader gradually leaks GPU memory
      # across repeated Compose launches, so each theme gets its own emulator.
      - name: Capture dark theme screenshots
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scope != 'light'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            timeout 60 adb wait-for-device || true
            timeout 900 adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done' || true
            timeout 180 adb install -r app/build/outputs/apk/debug/app-debug.apk || true
            timeout 30 adb shell cmd uimode night no || true
            timeout 30 adb shell settings put global window_animation_scale 0 || true
            timeout 30 adb shell settings put global transition_animation_scale 0 || true
            timeout 30 adb shell settings put global animator_duration_scale 0 || true
            timeout 30 adb shell appops set com.hmx.harness.debug MANAGE_EXTERNAL_STORAGE allow || true
            timeout 30 adb shell pm grant com.hmx.harness.debug android.permission.POST_NOTIFICATIONS || true
            mkdir -p screenshots logs

            # One debug process stays alive; broadcasts switch the shipped screen
            # composables without relaunching (which churns GPU layers and kills
            # SwiftShader). Host-side grabs avoid the guest screencap crash.

            timeout 45 adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen onboarding --es theme dark >/dev/null || true
            sleep 12
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/06-onboarding-dark.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen chat --es theme dark >/dev/null || true
            sleep 14
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/05-ai-chat-dark.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen providers --es theme dark >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/04-providers-dark.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen home --es theme dark >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/01-home-dark.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen appnav --es theme dark --es drawer open >/dev/null || true
            sleep 12
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/02-navigation-drawer-dark.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen settings --es theme dark >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/03-settings-dark.png" || true
            sleep 2


            timeout 30 adb logcat -d -v threadtime -t 1200 > logs/capture-dark.txt || true
            find screenshots -type f -name '*.png' -exec ls -lh {} \; || true

      - name: Capture light theme screenshots
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scope != 'dark'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          apk-path: app/build/outputs/apk/debug/app-debug.apk
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            timeout 60 adb wait-for-device || true
            timeout 900 adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done' || true
            timeout 180 adb install -r app/build/outputs/apk/debug/app-debug.apk || true
            timeout 30 adb shell cmd uimode night no || true
            timeout 30 adb shell settings put global window_animation_scale 0 || true
            timeout 30 adb shell settings put global transition_animation_scale 0 || true
            timeout 30 adb shell settings put global animator_duration_scale 0 || true
            timeout 30 adb shell appops set com.hmx.harness.debug MANAGE_EXTERNAL_STORAGE allow || true
            timeout 30 adb shell pm grant com.hmx.harness.debug android.permission.POST_NOTIFICATIONS || true
            mkdir -p screenshots logs

            # One debug process stays alive; broadcasts switch the shipped screen
            # composables without relaunching (which churns GPU layers and kills
            # SwiftShader). Host-side grabs avoid the guest screencap crash.

            timeout 45 adb shell am start -W -n com.hmx.harness.debug/com.hmx.harness.ui.showcase.GlassShowcaseActivity --es screen onboarding --es theme light >/dev/null || true
            sleep 12
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/06-onboarding-light.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen chat --es theme light >/dev/null || true
            sleep 14
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/05-ai-chat-light.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen providers --es theme light >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/04-providers-light.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen home --es theme light >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/01-home-light.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen appnav --es theme light --es drawer open >/dev/null || true
            sleep 12
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/02-navigation-drawer-light.png" || true
            sleep 2

            timeout 30 adb shell am broadcast -a com.hmx.harness.SET_GLASS_SCREEN --es screen settings --es theme light >/dev/null || true
            sleep 10
            timeout 20 adb shell uiautomator dump /sdcard/hmx-ui.xml >/dev/null || true
            timeout 10 adb shell grep -q 'Wait' /sdcard/hmx-ui.xml && timeout 10 adb shell input tap 330 1330 || true
            timeout 30 adb emu screenrecord screenshot "$GITHUB_WORKSPACE/screenshots/03-settings-light.png" || true
            sleep 2


            timeout 30 adb logcat -d -v threadtime -t 1200 > logs/capture-light.txt || true
            find screenshots -type f -name '*.png' -exec ls -lh {} \; || true

      - name: Verify screenshots exist
        run: |
          find screenshots -type f -name '*.png' -exec ls -lh {} \;
          test -n "$(find screenshots -name '*.png' -size +1k -print -quit)"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-screenshots
          path: screenshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-logs
          path: logs/**
          if-no-files-found: warn
          retention-days: 90

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmxharness-liquidglass-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## HMXHARNESS Liquid Glass visual QA"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Screenshots: artifact \`hmxharness-liquidglass-screenshots\`"
            echo "- Logs: artifact \`hmxharness-liquidglass-logs\`"
            echo "- APK: artifact \`hmxharness-liquidglass-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
